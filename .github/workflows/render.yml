name: Render Car House Short

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"    # 9 AM WAT daily

permissions:
  contents: write

concurrency:
  group: render-car-house
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg and librosa
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install librosa numpy

      - name: Render video
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python render.py

      - name: Publish release (Zapier picks this up)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE=$(python -c "import json;print(json.load(open('meta.json'))['title'])")
          DESC=$(python -c "import json;print(json.load(open('meta.json'))['description'])")
          gh release create "v${{ github.run_number }}" out.mp4 --title "$TITLE" --notes "$DESC"

      - name: Save used-clips tracker (so clips never repeat)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add used_clips.json
          if git diff --cached --quiet; then
            echo "no tracker changes"
          else
            git commit -m "Update used clips tracker (run ${{ github.run_number }})"
            git pull --rebase origin "${{ github.ref_name }}" || true
            git push origin "HEAD:${{ github.ref_name }}"
          fi
